services:
  - type: web
    name: pokemarket
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: ""
      - key: GEMINI_JOB_MAX_ATTEMPTS
        value: "3"
      - key: GEMINI_RETRY_BASE_SECONDS
        value: "12"
      - key: MAX_IMAGES
        value: "9"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "15"
      - key: AUTH_SECRET
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://pokemarket-4jwi.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_REPORT_EMAIL
        sync: false
      - key: SALE_DETAIL_RETENTION_DAYS
        value: "30"
      - key: CONFIRMATION_TIMEOUT_DAYS
        value: "10"
      - key: SETTLEMENT_WORKER_POLL_SECONDS
        value: "60"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: LEGACY_CLAIM_CODE
        sync: false
      - key: R2_BUCKET_NAME
        value: pokemart-images
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
